<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TERMINAL C.H.R.O.M.A. - Consola Criptográfica</title>
    <style>
        :root {
            --bg-color: #0b0d12;
            --case-color: #242832;
            --case-border: #14161d;
            --screen-bg: #051405;
            --text-green: #33ff33;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            background: radial-gradient(circle, #1a1d24 0%, var(--bg-color) 100%);
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
        }

        /* CARCASA DE LA CONSOLA (VISTA CENITAL) */
        .console-chassis {
            background: linear-gradient(145deg, #2b303c, #1d2028);
            border: 6px solid var(--case-border);
            border-radius: 30px;
            padding: 25px 20px;
            box-shadow: 
                0 20px 40px rgba(0,0,0,0.8),
                inset 0 2px 4px rgba(255,255,255,0.1),
                inset 0 -5px 10px rgba(0,0,0,0.6);
            max-width: 440px;
            width: 100%;
            text-align: center;
            position: relative;
        }

        /* TORNILLOS EN LAS ESQUINAS PARA TOQUE INDUSTRIAL */
        .screw {
            position: absolute;
            width: 12px;
            height: 12px;
            background: #111;
            border-radius: 50%;
            border: 1px solid #444;
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.2);
        }
        .screw::after {
            content: '';
            position: absolute;
            top: 5px; left: 2px;
            width: 8px; height: 2px;
            background: #555;
        }
        .screw.top-left { top: 12px; left: 12px; }
        .screw.top-right { top: 12px; right: 12px; }
        .screw.bottom-left { bottom: 12px; left: 12px; }
        .screw.bottom-right { bottom: 12px; right: 12px; }

        /* PANTALLA CRT INTEGRADA */
        .screen-bezel {
            background: #0d0f14;
            border: 3px solid #1a1d26;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 25px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.9);
        }

        .screen {
            background: var(--screen-bg);
            border: 2px solid #114411;
            border-radius: 6px;
            padding: 12px;
            box-shadow: inset 0 0 12px rgba(0,255,0,0.25);
            position: relative;
            overflow: hidden;
        }

        /* EFECTO BARRIDO CRT EN PANTALLA */
        .screen::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            z-index: 2;
            pointer-events: none;
            opacity: 0.6;
        }

        .screen h1 {
            font-size: 1rem;
            color: var(--text-green);
            margin: 0 0 8px 0;
            text-shadow: 0 0 6px var(--text-green);
            letter-spacing: 2px;
        }

        .status-text {
            font-size: 0.85rem;
            color: #aaddaa;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.3;
            text-transform: uppercase;
        }

        /* PANEL DE BOTONES GIGANTES EN VISTA CENITAL */
        .pad-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 20px;
            border: 2px solid rgba(0,0,0,0.4);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        /* BOTONES EXTRA GRANDES TIPO LENTE/CÚPULA */
        .btn-pad {
            height: 135px;
            border-radius: 50%;
            border: 8px solid #161820;
            cursor: pointer;
            outline: none;
            position: relative;
            transition: all 0.08s ease;
            box-shadow: 
                0 10px 15px rgba(0,0,0,0.7),
                inset 0 6px 12px rgba(255,255,255,0.35),
                inset 0 -6px 12px rgba(0,0,0,0.6);
        }

        .btn-pad:active, .btn-pad.active {
            transform: scale(0.95) translateY(4px);
            box-shadow: 
                0 3px 6px rgba(0,0,0,0.8),
                inset 0 2px 6px rgba(0,0,0,0.8);
            filter: brightness(1.3);
        }

        /* GRADIENTES Y COLORES CENITALES */
        #red { background: radial-gradient(circle at 35% 35%, #ff4d4d 0%, #a00000 70%, #4a0000 100%); }
        #red.active { box-shadow: 0 0 30px #ff0000, inset 0 0 15px #fff; }

        #blue { background: radial-gradient(circle at 35% 35%, #4d79ff 0%, #0022a0 70%, #000a4a 100%); }
        #blue.active { box-shadow: 0 0 30px #0055ff, inset 0 0 15px #fff; }

        #yellow { background: radial-gradient(circle at 35% 35%, #ffff66 0%, #a0a000 70%, #4a4a00 100%); }
        #yellow.active { box-shadow: 0 0 30px #ffff00, inset 0 0 15px #fff; }

        #green { background: radial-gradient(circle at 35% 35%, #66ff66 0%, #00a000 70%, #004a00 100%); }
        #green.active { box-shadow: 0 0 30px #00ff00, inset 0 0 15px #fff; }

        /* BOTÓN SISTEMA / START */
        .control-btn {
            background: linear-gradient(180deg, #3a3f4d, #1e2129);
            color: var(--text-green);
            border: 2px solid #4a5062;
            padding: 14px;
            font-family: inherit;
            font-weight: bold;
            font-size: 0.95rem;
            border-radius: 8px;
            cursor: pointer;
            letter-spacing: 1.5px;
            transition: all 0.15s;
            width: 100%;
            box-shadow: 0 5px 10px rgba(0,0,0,0.5), inset 0 1px 2px rgba(255,255,255,0.2);
        }

        .control-btn:hover {
            background: #4a5062;
            color: #fff;
        }

        /* DESPLEGABLE REVELACIÓN FINAL (QR) */
        .secret-coords {
            display: none;
            background: #030d03;
            border: 2px dashed var(--text-green);
            padding: 15px;
            margin-top: 15px;
            border-radius: 8px;
            color: var(--text-green);
            animation: fadeIn 0.5s ease-in-out;
        }

        .qr-img {
            width: 190px;
            height: 190px;
            border: 3px solid var(--text-green);
            border-radius: 8px;
            margin: 10px 0;
            background: #fff;
            padding: 5px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="console-chassis">
    <!-- Detalle industrial: Tornillos -->
    <div class="screw top-left"></div>
    <div class="screw top-right"></div>
    <div class="screw bottom-left"></div>
    <div class="screw bottom-right"></div>

    <!-- PANTALLA -->
    <div class="screen-bezel">
        <div class="screen">
            <h1>[ CONSOLA C.H.R.O.M.A. ]</h1>
            <div class="status-text" id="status">PULSA "INICIAR MISIÓN" PARA INICIAR LA DECODIFICACIÓN</div>
        </div>
    </div>

    <!-- BOTONES GRANDES (VISTA CENITAL) -->
    <div class="pad-grid">
        <div class="btn-pad" id="red" onclick="handleUserClick('red')"></div>
        <div class="btn-pad" id="blue" onclick="handleUserClick('blue')"></div>
        <div class="btn-pad" id="yellow" onclick="handleUserClick('yellow')"></div>
        <div class="btn-pad" id="green" onclick="handleUserClick('green')"></div>
    </div>

    <!-- BOTÓN DE INICIO -->
    <button class="control-btn" id="start-btn" onclick="startGame()">INICIAR MISIÓN</button>

    <!-- PANEL FINAL CON QR (PROVISIONAL HASTA QUE TENGAS EL TUYO) -->
    <div class="secret-coords" id="coords-box">
        <strong>¡ACREDITACIÓN CONCEDIDA!</strong><br><br>
        <span style="font-size: 0.8rem;">ESCANEA O PULSA EN EL CÓDIGO QR PARA OBTENER LA CLAVE FÍSICA:</span><br>
        
        <a href="qr.png" target="_blank">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=190x190&data=PROXIMAMENTE_QR_FINAL" alt="Código QR Secreto" class="qr-img">
        </a>
    </div>
</div>

<script>
    // Audio Context para tonos analógicos
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    const frequencies = {
        red: 261.63,    // C4
        blue: 329.63,   // E4
        yellow: 392.00, // G4
        green: 523.25   // C5
    };

    const colors = ['red', 'blue', 'yellow', 'green'];
    let sequence = [];
    let userStep = 0;
    let currentLevel = 1;
    const targetLengths = { 1: 3, 2: 5, 3: 7 };
    let isPlayingSequence = false;

    function playTone(color, duration = 300) {
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        
        osc.type = 'sawtooth';
        osc.frequency.value = frequencies[color];
        
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration / 1000);
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        osc.start();
        osc.stop(audioCtx.currentTime + duration / 1000);

        const btn = document.getElementById(color);
        btn.classList.add('active');
        setTimeout(() => btn.classList.remove('active'), duration - 50);
    }

    function updateStatus(text) {
        document.getElementById('status').innerText = text;
    }

    function startGame() {
        document.getElementById('start-btn').style.display = 'none';
        document.getElementById('coords-box').style.display = 'none';
        currentLevel = 1;
        startLevel();
    }

    function startLevel() {
        sequence = [];
        userStep = 0;
        const totalNotes = targetLengths[currentLevel];
        updateStatus(`NIVEL ${currentLevel}/3: RECEPTOR SINTONIZANDO (${totalNotes} FRECUENCIAS)...`);
        
        for (let i = 0; i < totalNotes; i++) {
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            sequence.push(randomColor);
        }

        setTimeout(() => playSequence(), 1500);
    }

    function playSequence() {
        isPlayingSequence = true;
        let speed = 600 - (currentLevel * 70);

        sequence.forEach((color, index) => {
            setTimeout(() => {
                playTone(color, speed - 100);
                if (index === sequence.length - 1) {
                    setTimeout(() => {
                        isPlayingSequence = false;
                        updateStatus(`NIVEL ${currentLevel}: REPITE LA SECUENCIA`);
                    }, speed);
                }
            }, index * speed);
        });
    }

    function handleUserClick(color) {
        if (isPlayingSequence) return;

        playTone(color, 250);

        if (color === sequence[userStep]) {
            userStep++;
            if (userStep === sequence.length) {
                if (currentLevel < 3) {
                    updateStatus(`¡FASE ${currentLevel} COMPLETADA! ELEVANDO SEGURIDAD...`);
                    currentLevel++;
                    setTimeout(() => startLevel(), 1500);
                } else {
                    updateStatus("¡DESCRIPTACIÓN COMPLETADA CON ÉXITO!");
                    document.getElementById('coords-box').style.display = 'block';
                }
            }
        } else {
            updateStatus("❌ ERROR EN LA FRECUENCIA. REINICIANDO TERMINAL...");
            playErrorSound();
            document.getElementById('start-btn').style.display = 'block';
            document.getElementById('start-btn').innerText = 'REINTENTAR MISIÓN';
        }
    }

    function playErrorSound() {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.value = 110;
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.5);
    }
</script>

</body>
</html>
